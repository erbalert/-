name: Deploy to GitHub Pages

# Собирает приложение и публикует его на GitHub Pages.
# Использует официальный flow (configure-pages с enablement: true),
# который сам включает Pages — пользователю не нужно ничего трогать в настройках.
on:
  push:
    branches:
      - claude/income-expense-tracker-1gpt58
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать несколько деплоев параллельно.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Включает Pages (source = GitHub Actions), если он ещё не включён.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build (base=/-/)
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
