name: Deploy to GitHub Pages

# Собирает приложение и публикует его на GitHub Pages.
# Триггерится при push в рабочую ветку, а также вручную (workflow_dispatch).
on:
  push:
    branches:
      - claude/income-expense-tracker-1gpt58
  workflow_dispatch:

# contents: write — пушить собранный сайт в ветку gh-pages;
# pages: write — включить GitHub Pages через API, чтобы не делать это вручную.
permissions:
  contents: write
  pages: write

# Не запускать несколько деплоев параллельно.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base=/-/)
        run: npm run build:pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      # Включаем GitHub Pages из ветки gh-pages через API, чтобы пользователю
      # не нужно было делать это вручную в настройках. Если Pages уже включён —
      # API вернёт 409, это ожидаемо и не считается ошибкой.
      - name: Enable GitHub Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "POST /pages -> HTTP $code"
          cat /tmp/pages.json || true
          if [ "$code" = "409" ]; then
            echo "Pages уже включён — обновляем источник на gh-pages."
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          elif [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "Не удалось включить Pages автоматически (HTTP $code)."
            echo "Включите вручную: Settings → Pages → Source → Deploy from a branch → gh-pages / root."
          fi
